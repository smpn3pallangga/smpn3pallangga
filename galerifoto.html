<style>
    :root {

    * { box-sizing: border-box; }

    .photo-lightbox-media img { width: 100%; height: 100%; max-height: 92dvh; object-fit: contain; display: block; }
    .photo-lightbox-info { display: flex; flex-direction: column; justify-content: flex-end; gap: .7rem; padding: 1.2rem; color: #eaf2ff; background: radial-gradient(circle at top right, rgba(96,165,250,.18), transparent 34%), linear-gradient(180deg, #0d1b33, #071225); }
    .photo-lightbox-info h3 { margin: 0; color: #fff; font-size: clamp(1.12rem, 2vw, 1.45rem); line-height: 1.25; }
    .photo-lightbox-info p { margin: 0; color: rgba(234,242,255,.78); line-height: 1.7; font-size: .94rem; }
    .photo-lightbox-close { position: absolute; top: .75rem; right: .75rem; z-index: 3; display: grid; width: 42px; height: 42px; place-items: center; border: 1px solid rgba(255,255,255,.26); border-radius: 999px; background: rgba(4,13,30,.72); color: #fff; cursor: pointer; }
    .photo-lightbox-close:hover { background: rgba(255,255,255,.16); }
    .photo-lightbox-nav { position: absolute; top: 50%; z-index: 3; display: grid; width: 46px; height: 46px; place-items: center; border: 1px solid rgba(255,255,255,.28); border-radius: 999px; background: rgba(4,13,30,.72); color: #fff; cursor: pointer; transform: translateY(-50%); }
    .photo-lightbox-nav:hover { background: rgba(255,255,255,.18); }
    .photo-lightbox-nav[hidden] { display: none; }
    .photo-lightbox-prev { left: .75rem; }
    .photo-lightbox-next { right: calc(360px + .75rem); }
    .photo-lightbox-position { color: rgba(234,242,255,.68); font-size: .78rem; font-weight: 800; }
    @media (max-width: 760px) {
        .photo-lightbox { padding: .7rem; }
        .photo-lightbox-dialog { grid-template-columns: 1fr; max-height: 92dvh; border-radius: 18px; }
        .photo-lightbox-media { min-height: min(58dvh, 460px); }
        .photo-lightbox-info { padding: .95rem; }
        .photo-lightbox-nav { top: min(29dvh, 230px); width: 40px; height: 40px; }
        .photo-lightbox-next { right: .75rem; }
    }
</style>
</head>
<body>
<div id="site-header"></div>

<main class="container page-wrap">
    <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a>
        <span class="sep">/</span>
        <span class="current">Galeri Foto</span>
    </nav>

    <section class="gallery-hero">
        <div class="gallery-hero-kicker"><i class="fas fa-camera-retro"></i> Galeri</div>
        <h1>Galeri Foto</h1>
        <p>Dokumentasi kegiatan, fasilitas, dan momen sekolah SMP Negeri 3 Pallangga. Pilih kategori untuk menyaring foto, atau klik salah satu foto untuk melihat versi penuh.</p>
    </section>

    <div class="gallery-toolbar">
        <div class="gallery-tabs" data-galeri-foto-tabs></div>
        <span class="gallery-count" data-galeri-foto-count>Memuat...</span>
    </div>

    <div class="gallery-grid" data-galeri-foto-grid></div>
</main>

<div id="site-footer"></div>

<!-- Lightbox foto (identik dengan yang di index.html, dipakai bersama) -->
<div class="photo-lightbox" data-photo-lightbox aria-hidden="true">
    <div class="photo-lightbox-dialog" role="dialog" aria-modal="true" aria-label="Detail foto">
        <button type="button" class="photo-lightbox-close" data-photo-lightbox-close aria-label="Tutup detail foto"><i class="fas fa-times"></i></button>
        <button type="button" class="photo-lightbox-nav photo-lightbox-prev" data-photo-lightbox-prev aria-label="Foto sebelumnya"><i class="fas fa-chevron-left"></i></button>
        <button type="button" class="photo-lightbox-nav photo-lightbox-next" data-photo-lightbox-next aria-label="Foto berikutnya"><i class="fas fa-chevron-right"></i></button>
        <div class="photo-lightbox-media"><img src="" alt="" data-photo-lightbox-image></div>
        <div class="photo-lightbox-info">
            <span class="theme-badge theme-badge-primary" data-photo-lightbox-category>Galeri Foto</span>
            <span class="photo-lightbox-position" data-photo-lightbox-position></span>
            <h3 data-photo-lightbox-title>Detail Foto</h3>
            <p data-photo-lightbox-description></p>
        </div>
    </div>
</div>

<script>
(() => {
    const lightbox = document.querySelector('[data-photo-lightbox]');
    if (!lightbox) return;
    const image = lightbox.querySelector('[data-photo-lightbox-image]');
    const title = lightbox.querySelector('[data-photo-lightbox-title]');
    const category = lightbox.querySelector('[data-photo-lightbox-category]');
    const description = lightbox.querySelector('[data-photo-lightbox-description]');
    const position = lightbox.querySelector('[data-photo-lightbox-position]');
    const closeButtons = lightbox.querySelectorAll('[data-photo-lightbox-close]');
    const previousButton = lightbox.querySelector('[data-photo-lightbox-prev]');
    const nextButton = lightbox.querySelector('[data-photo-lightbox-next]');
    let albumItems = [];
    let activeIndex = 0;

    const itemFromTrigger = (trigger) => ({
        key: trigger.dataset.photoKey || '',
        image: trigger.dataset.photoSrc || '',
        title: trigger.dataset.photoTitle || 'Detail Foto',
        album: trigger.dataset.photoCategory || 'Galeri Foto',
        album_description: trigger.dataset.photoDescription || '',
    });

    const registeredItems = () => {
        const items = [];
        document.querySelectorAll('[data-photo-lightbox-items]').forEach((registry) => {
            try { items.push(...JSON.parse(registry.textContent || '[]')); }
            catch (error) { console.warn('Daftar foto album tidak dapat dibaca.', error); }
        });
        return items;
    };

    const render = () => {
        const item = albumItems[activeIndex];
        if (!item) return;
        if (image) { image.src = item.image || ''; image.alt = item.title || 'Detail foto'; }
        if (title) title.textContent = item.title || 'Detail Foto';
        if (category) category.textContent = item.album || 'Galeri Foto';
        if (description) { description.textContent = item.album_description || ''; description.style.display = item.album_description ? '' : 'none'; }
        if (position) position.textContent = albumItems.length > 1 ? `Foto ${activeIndex + 1} dari ${albumItems.length}` : '';
        const showNavigation = albumItems.length > 1;
        if (previousButton) previousButton.hidden = !showNavigation;
        if (nextButton) nextButton.hidden = !showNavigation;
    };

    const move = (step) => {
        if (albumItems.length < 2) return;
        activeIndex = (activeIndex + step + albumItems.length) % albumItems.length;
        render();
    };

    const close = () => {
        lightbox.classList.remove('is-open');
        lightbox.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        if (image) image.src = '';
    };

    const open = (trigger) => {
        const selectedItem = itemFromTrigger(trigger);
        if (!selectedItem.image) return;
        const sourceItems = registeredItems();
        const fallbackItems = [...document.querySelectorAll('[data-photo-lightbox-trigger]')].map(itemFromTrigger);
        const candidates = sourceItems.length > 0 ? sourceItems : fallbackItems;
        albumItems = candidates.filter((item) => item.image && item.album === selectedItem.album);
        activeIndex = albumItems.findIndex((item) => (
            selectedItem.key && String(item.key || '') === selectedItem.key
        ) || (item.image === selectedItem.image && item.title === selectedItem.title));
        if (activeIndex < 0) { albumItems.unshift(selectedItem); activeIndex = 0; }
        lightbox.classList.add('is-open');
        lightbox.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        render();
    };

    document.addEventListener('click', (event) => {
        const trigger = event.target.closest('[data-photo-lightbox-trigger]');
        if (!trigger) return;
        event.preventDefault();
        open(trigger);
    });

    document.addEventListener('keydown', (event) => {
        if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('[data-photo-lightbox-trigger]')) {
            event.preventDefault(); open(event.target); return;
        }
        if (event.key === 'Escape' && lightbox.classList.contains('is-open')) { close(); return; }
        if (event.key === 'ArrowLeft' && lightbox.classList.contains('is-open')) { event.preventDefault(); move(-1); }
        if (event.key === 'ArrowRight' && lightbox.classList.contains('is-open')) { event.preventDefault(); move(1); }
    });

    lightbox.addEventListener('click', (event) => { if (event.target === lightbox) close(); });
    closeButtons.forEach((button) => button.addEventListener('click', close));
    previousButton?.addEventListener('click', () => move(-1));
    nextButton?.addEventListener('click', () => move(1));
})();
</script>

<!-- Memuat & merender data galeri foto dari sumber data bersama -->
<script src="assets/js/galeri-foto.js" defer></script>
<script src="assets/js/site-includes.js"></script>
</body>
