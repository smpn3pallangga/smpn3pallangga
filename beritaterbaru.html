<!DOCTYPE html>
<html lang="id" style="--public-header-offset: 76px;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berita Terbaru | SMP NEGERI 3 PALLANGGA</title>
<meta name="description" content="Kumpulan berita dan publikasi terbaru dari SMP Negeri 3 Pallangga.">

<link rel="shortcut icon" href="assets/images/logosmp.jpg">
<link rel="apple-touch-icon" href="assets/images/logosmp.jpg">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css">
<style>
    :root {
        --bg: #f5f9ff;
        --surface: #ffffff;
        --ink: #18263f;
        --heading: #132238;
        --muted: #765e48;
        --line: #e3cba8;
        --primary: #1d4ed8;
        --primary-2: #1e3a8a;
        --accent: #84cc16;
        --radius: 18px;
        --container-width: 1062px;
        --button-radius: 16px;
        --card-shadow: 0 22px 44px rgba(18, 42, 76, .12);
        --topbar-bg: linear-gradient(135deg, color-mix(in srgb, #1e3a8a 92%, #06111f), color-mix(in srgb, #1d4ed8 88%, #071326));
        --topbar-text: #ffffff;
        --topbar-line: rgba(255,255,255,.22);
        --topbar-subtle-line: rgba(255,255,255,.18);
        --topbar-active-text: #ffffff;
        --topbar-active-bg: rgba(255,255,255,.14);
        --topbar-pill-bg: rgba(255,255,255,.13);
        --topbar-pill-text: #ffffff;
        --topbar-marquee-bg: color-mix(in srgb, #1e3a8a 82%, #071326);
        --topbar-marquee-text: #ffffff;
        --footer-bg: linear-gradient(145deg, color-mix(in srgb, #1e3a8a 88%, #050b18), color-mix(in srgb, #1d4ed8 72%, #071326));
        --footer-text: #dbe7f6;
        --section-gap: .8rem;
        --font-body: 'Plus Jakarta Sans', sans-serif;
        --font-heading: 'Plus Jakarta Sans', 'Plus Jakarta Sans', sans-serif;
        --public-header-offset: 110px;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
    body {
        position: relative; isolation: isolate; min-height: 100vh; margin: 0;
        padding-top: var(--public-header-offset);
        font-family: var(--font-body); color: var(--ink);
        background:
            radial-gradient(860px 460px at 8% -12%, color-mix(in srgb, var(--primary) 24%, transparent) 0%, transparent 72%),
            radial-gradient(700px 360px at 95% 8%, color-mix(in srgb, var(--accent) 18%, transparent) 0%, transparent 68%),
            linear-gradient(180deg, color-mix(in srgb, var(--bg) 82%, white), var(--bg));
    }
    a { color: inherit; }
    h1,h2,h3,h4,h5,h6 { margin-top: 0; color: var(--heading); letter-spacing: .1px; font-family: var(--font-heading); }
    .container { width: 100%; max-width: var(--container-width); padding-left: 1rem; padding-right: 1rem; margin: 0 auto; }
    .topbar { position: fixed; top:0; left:0; right:0; z-index:1200; backdrop-filter: blur(6px); background: var(--topbar-bg); border-bottom: 1px solid var(--topbar-line); box-shadow: 0 10px 26px rgba(15,31,56,.08); }
    main[id], section[id], [id].scroll-target { scroll-margin-top: calc(var(--public-header-offset) + 16px); }
    .topbar-marquee { border-top: 1px solid var(--topbar-subtle-line); border-bottom: 1px solid var(--topbar-subtle-line); background: var(--topbar-marquee-bg); overflow: hidden; white-space: nowrap; }
    .topbar-marquee-track { display: inline-block; padding: .42rem 0; color: var(--topbar-marquee-text); font-size: .84rem; font-weight: 600; animation: marquee-move 26s linear infinite; }
    @keyframes marquee-move { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    .topbar-inner { display: grid; grid-template-columns: minmax(220px, max-content) minmax(0, 1fr); grid-template-areas: "brand utility" "nav nav"; align-items: center; padding: .8rem 0 .65rem; gap: .8rem 1rem; min-width: 0; position: relative; }
    .brand { grid-area: brand; display: flex; align-items: center; gap: .65rem; text-decoration: none; color: var(--topbar-text); font-weight: 800; letter-spacing: .2px; min-width: 0; }
    .brand span:last-child { display: block; min-width: 0; max-width: min(38vw, 440px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-badge { width: 36px; height: 36px; flex-shrink: 0; overflow: hidden; border-radius: 12px; display: grid; place-items: center; color: #fff; font-weight: 700; background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 74%, var(--surface))); box-shadow: 0 8px 18px color-mix(in srgb, var(--primary) 30%, transparent); }
    .brand-badge img { width: 100%; height: 100%; object-fit: contain; }
    .topbar-utility { grid-area: utility; display: flex; align-items: center; justify-content: flex-end; gap: .5rem; min-width: 0; flex-wrap: wrap; }
    .topbar-social { display: inline-flex; align-items: center; gap: .32rem; padding: .2rem; border: 1px solid var(--topbar-subtle-line); border-radius: 999px; background: var(--topbar-pill-bg); }
    .topbar-social-link { width: 30px; height: 30px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; color: var(--topbar-pill-text); text-decoration: none; transition: .18s ease; }
    .topbar-social-link:hover { text-decoration: none; color: #fff; background: var(--primary); }
    .topbar-contact-pill { max-width: 240px; display: inline-flex; align-items: center; gap: .45rem; padding: .48rem .78rem; border: 1px solid var(--topbar-subtle-line); border-radius: 999px; background: var(--topbar-pill-bg); color: var(--topbar-pill-text); text-decoration: none; font-size: .8rem; font-weight: 700; line-height: 1; }
    .topbar-contact-pill:hover { text-decoration: none; color: var(--primary); border-color: color-mix(in srgb, var(--primary) 28%, white); }
    .topbar-contact-pill span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-links { grid-area: nav; display: flex; align-items: flex-start; gap: 1rem; min-width: 0; justify-content: space-between; width: 100%; padding-top: .25rem; border-top: 1px solid var(--topbar-subtle-line); }
    .desktop-nav-shell { width: 100%; display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
    .mobile-nav-shell { display: none; width: 100%; }
    .public-nav { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; flex-wrap: wrap; gap: .2rem; min-width: 0; flex: 1 1 auto; }
    .public-nav-desktop { align-items: flex-start; }
    .public-nav-mobile { width: 100%; }
    .nav-item { position: relative; }
    .nav-link-main { appearance: none; border: 0; background: transparent; cursor: pointer; text-decoration: none; color: color-mix(in srgb, var(--topbar-text) 70%, transparent); font-weight: 600; font-size: .94rem; display: inline-flex; align-items: center; gap: .35rem; padding: .5rem .62rem; border-radius: 10px; white-space: nowrap; }
    .nav-link-main:hover, .nav-link-main.active { color: var(--topbar-active-text); background: var(--topbar-active-bg); }
    .nav-caret { display: inline-flex; width: 14px; height: 14px; opacity: .75; transition: transform .2s ease; }
    .nav-caret svg { width: 100%; height: 100%; }
    .nav-submenu { list-style: none; margin: 0; padding: .45rem; position: absolute; top: calc(100% + 8px); left: 0; min-width: 210px; border: 1px solid var(--line); border-radius: 12px; background: #fff; box-shadow: 0 16px 30px rgba(17, 36, 68, .12); opacity: 0; visibility: hidden; transform: translateY(8px); transition: .18s ease; z-index: 40; }
    .nav-item:focus-within > .nav-submenu, .nav-item:hover > .nav-submenu { opacity: 1; visibility: visible; transform: translateY(0); }
    .nav-submenu .nav-link-main { width: 100%; justify-content: space-between; border-radius: 8px; color: #405572; }
    .nav-submenu .nav-link-main:hover, .nav-submenu .nav-link-main.active { color: var(--primary); background: color-mix(in srgb, var(--primary) 10%, white); }
    .nav-auth { display: inline-flex; gap: .5rem; flex-shrink: 0; align-items: center; justify-content: flex-end; }
    .mobile-menu-toggle { display: none; grid-area: mobile; justify-self: end; width: 42px; height: 42px; border-radius: 11px; border: 1px solid var(--topbar-subtle-line); background: var(--topbar-pill-bg); align-items: center; justify-content: center; gap: 4px; padding: 0; flex-direction: column; cursor: pointer; }
    .mobile-menu-toggle span { width: 16px; height: 2px; border-radius: 999px; background: var(--topbar-pill-text); }
    .theme-breadcrumb { display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; margin-bottom: .9rem; font-size: .86rem; color: #7b8aa6; }
    .theme-breadcrumb a { color: #6b7b99; text-decoration: none; }
    .theme-breadcrumb a:hover { color: var(--primary); }
    .theme-breadcrumb .sep { color: #a0aec7; }
    .theme-breadcrumb .current { color: #4d6082; font-weight: 600; }
    .page-wrap { padding: 1.1rem 0 1.2rem; }
    .footer { border-top: 1px solid color-mix(in srgb, var(--primary) 38%, #050b18); color: var(--footer-text); font-size: .9rem; padding: 1.45rem 0 1.2rem; background: var(--footer-bg); }
    .footer-card { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); border-radius: 16px; box-shadow: 0 18px 34px rgba(3,10,24,.16); padding: 1rem; backdrop-filter: blur(4px); }
    .footer-grid { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    .footer-brand { display: flex; align-items: center; gap: .65rem; margin-bottom: .55rem; color: #fff; font-weight: 800; font-size: 1.08rem; }
    .footer-badge { width: 30px; height: 30px; flex-shrink: 0; overflow: hidden; border-radius: 10px; display: grid; place-items: center; color: #fff; font-weight: 700; background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 74%, var(--surface))); }
    .footer-badge img { width: 100%; height: 100%; object-fit: contain; }
    .footer-title { margin: 0 0 .55rem; font-size: .92rem; font-weight: 800; color: #fff; letter-spacing: .2px; }
    .footer-text { margin: 0; color: color-mix(in srgb, #ffffff 78%, var(--accent)); line-height: 1.7; font-size: .88rem; }
    .footer-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .45rem; }
    .footer-item { display: flex; align-items: flex-start; gap: .45rem; color: color-mix(in srgb, #ffffff 78%, var(--primary)); font-size: .88rem; line-height: 1.6; }
    .footer-icon { width: 16px; height: 16px; flex-shrink: 0; margin-top: .15rem; color: color-mix(in srgb, var(--accent) 72%, white); }
    .footer-social { list-style: none; margin: 0; padding: 0; display: flex; gap: .5rem; flex-wrap: wrap; }
    .footer-social a { width: 34px; height: 34px; border-radius: 10px; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.1); color: #fff; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; transition: .18s ease; }
    .footer-social a:hover { background: color-mix(in srgb, var(--accent) 78%, white); border-color: transparent; transform: translateY(-1px); }
    .footer-bottom { border-top: 1px solid rgba(255,255,255,.16); padding-top: .8rem; display: flex; justify-content: space-between; gap: .7rem; flex-wrap: wrap; color: color-mix(in srgb, #ffffff 72%, var(--primary)); font-size: .83rem; }
    .wa-float { position: fixed; right: 18px; bottom: 18px; width: 56px; height: 56px; border-radius: 50%; border: 0; display: inline-flex; align-items: center; justify-content: center; color: #fff; background: linear-gradient(145deg, #25d366, #1aa84f); box-shadow: 0 14px 24px rgba(20,122,58,.35); z-index: 60; text-decoration: none; transition: transform .16s ease, box-shadow .16s ease; }
    .wa-float:hover { transform: translateY(-2px); box-shadow: 0 16px 26px rgba(20,122,58,.42); color: #fff; }
    .wa-float svg { width: 28px; height: 28px; }
    .mobile-bottom-nav { display: none; }
    @media (max-width: 980px) {
        .topbar-inner { display: flex; align-items: center; padding: .85rem 0; gap: .65rem; }
        .brand { flex: 1 1 auto; min-width: 0; }
        .brand-badge { width: 40px; height: 40px; border-radius: 14px; flex: 0 0 auto; }
        .brand span:last-child { max-width: none; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.15; font-size: .98rem; }
        .topbar-utility { display: none; }
        .mobile-menu-toggle { display: inline-flex; margin-left: auto; width: 48px; height: 48px; border-radius: 14px; flex: 0 0 auto; }
        .nav-links { display: none; flex-direction: column; align-items: flex-start; position: absolute; top: calc(100% + 8px); left: 0; right: 0; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 16px 30px rgba(17,36,68,.12); padding: .7rem; z-index: 1300; border-top: 1px solid var(--line); }
        .nav-links.is-open { display: flex; }
        .desktop-nav-shell { display: none; }
        .mobile-nav-shell { display: flex; width: 100%; flex-direction: column; }
        .public-nav { width: 100%; flex-direction: column; align-items: stretch; gap: .3rem; }
        .nav-item { border-radius: 12px; }
        .nav-link-main { width: 100%; justify-content: space-between; border-radius: 10px; padding: .62rem .72rem; color: #4f6286; font-weight: 700; }
        .nav-item.nav-has-children > .nav-link-main { background: #f7faff; border: 1px solid #e1e9f5; }
        .nav-link-main.active { background: #eaf2ff; color: #12458d; border-color: #cbdcf4; }
        .nav-submenu { display: none; border: 0; box-shadow: none; background: transparent; position: static; opacity: 1; visibility: visible; transform: none; min-width: 0; padding: .35rem 0 0 .55rem; margin-top: .2rem; border-left: 2px solid #dce7f7; margin-left: .4rem; }
        .nav-item.is-open > .nav-submenu { display: block; }
        .nav-level-2 > .nav-link-main { font-weight: 600; padding: .5rem .6rem; color: #5f7293; background: #fff; }
        .footer-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 760px) {
        body { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
        .topbar { width: 100vw; max-width: 100vw; overflow: visible; }
        .topbar-marquee { width: 100vw; max-width: 100vw; overflow-x: hidden; }
        .container { width: 100%; max-width: 100%; padding-left: .7rem; padding-right: .7rem; }
        .footer-grid { grid-template-columns: 1fr; }
        .wa-float { width: 50px; height: 50px; right: 12px; bottom: calc(94px + env(safe-area-inset-bottom)); }
        .mobile-bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .2rem; background: rgba(255,255,255,.97); border-top: 1px solid #d5e1f2; box-shadow: 0 14px 26px rgba(22,45,82,.18); padding: .35rem .25rem calc(.35rem + env(safe-area-inset-bottom)); z-index: 55; backdrop-filter: blur(4px); }
        .mobile-bottom-link { text-decoration: none; color: #617492; display: grid; justify-items: center; gap: .18rem; padding: .35rem .2rem; border-radius: 10px; font-size: .68rem; font-weight: 700; line-height: 1.1; text-align: center; }
        .mobile-bottom-link svg { width: 18px; height: 18px; }
        .mobile-bottom-link.active { color: #12458d; background: #eaf2ff; }
    }

    /* Archive-specific */
    .archive-header { margin-bottom: 1.3rem; }
    .archive-header h1 { font-family: var(--font-heading); font-size: 1.7rem; color: var(--heading); margin: 0 0 .35rem; }
    .archive-header p { margin: 0; color: var(--muted); }

    .latest-news-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .9rem; margin-bottom: 2.4rem; }
    .latest-news-card { display: flex; flex-direction: column; gap: .72rem; height: 100%; padding: .72rem; border-radius: var(--radius); border: 1px solid color-mix(in srgb, var(--primary) 16%, var(--line)); background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 96%, var(--primary)), var(--surface)); box-shadow: 0 14px 32px rgba(20, 43, 78, .055); transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; text-decoration: none; }
    .latest-news-card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--primary) 30%, var(--line)); box-shadow: 0 18px 40px color-mix(in srgb, var(--primary) 12%, transparent); }
    .latest-news-thumb { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; min-height: 0; overflow: hidden; border-radius: calc(var(--radius) * .72); background: radial-gradient(circle at top right, color-mix(in srgb, var(--accent) 24%, transparent), transparent 48%), linear-gradient(135deg, color-mix(in srgb, var(--primary) 18%, var(--surface)), color-mix(in srgb, var(--primary) 7%, var(--surface))); text-decoration: none; }
    .latest-news-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; transition: transform .22s ease; }
    .latest-news-card:hover .latest-news-thumb img { transform: scale(1.025); }
    .latest-news-thumb-placeholder { display: grid; width: 100%; height: 100%; place-items: center; color: var(--primary); font-size: 1.4rem; }
    .latest-news-body { display: flex; min-width: 0; flex-direction: column; gap: .58rem; flex: 1; }
    .latest-news-body .chip { display: inline-block; width: fit-content; font-size: .72rem; font-weight: 800; letter-spacing: .4px; padding: .3rem .65rem; border-radius: 999px; background: color-mix(in srgb, var(--primary) 12%, var(--surface)); color: var(--primary); border: 1px solid color-mix(in srgb, var(--primary) 22%, var(--line)); margin: 0; }
    .latest-news-title { margin: 0; font-family: var(--font-body); font-size: 1rem; font-weight: 850; line-height: 1.34; }
    .latest-news-title a { color: var(--heading); text-decoration: none; }
    .latest-news-title a:hover { color: var(--primary); text-decoration: none; }
    .latest-news-footer { margin-top: auto; display: inline-flex; align-items: center; gap: .38rem; color: color-mix(in srgb, var(--muted) 86%, var(--primary)); font-size: .82rem; line-height: 1.3; }
    .latest-news-empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 2rem 0; }
    @media (max-width: 980px) { .latest-news-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 640px) { .latest-news-grid { grid-template-columns: 1fr; gap: .65rem; } .latest-news-card { padding: .62rem; } .latest-news-title { font-size: .92rem; } }
</style>
</head>
