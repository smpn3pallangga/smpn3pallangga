<style>
    :root {
        --bg: #f5f9ff;
        --surface: #ffffff;
        --ink: #18263f;
        --heading: #132238;
        --muted: #765e48;
        --line: #e3cba8;
        --primary: #1d4ed8;
        --primary-2: #1e3a8a;
        --accent: #84cc16;
        --radius: 18px;
        --container-width: 1062px;
        --button-radius: 16px;
        --card-shadow: 0 22px 44px rgba(18, 42, 76, .12);
        --topbar-bg: linear-gradient(135deg, color-mix(in srgb, #1e3a8a 92%, #06111f), color-mix(in srgb, #1d4ed8 88%, #071326));
        --topbar-text: #ffffff;
        --topbar-line: rgba(255,255,255,.22);
        --topbar-pill-bg: rgba(255,255,255,.13);
        --topbar-pill-text: #ffffff;
        --footer-bg: linear-gradient(145deg, color-mix(in srgb, #1e3a8a 88%, #050b18), color-mix(in srgb, #1d4ed8 72%, #071326));
        --footer-text: #dbe7f6;
        --font-body: 'Plus Jakarta Sans', sans-serif;
        --font-heading: 'Plus Jakarta Sans', sans-serif;
        --public-header-offset: 110px;
        --topbar-subtle-line: rgba(255,255,255,.18);
        --topbar-active-text: #ffffff;
        --topbar-active-bg: rgba(255,255,255,.14);
        --topbar-marquee-bg: color-mix(in srgb, #1e3a8a 82%, #071326);
        --topbar-marquee-text: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
    body {
        margin: 0;
        padding-top: var(--public-header-offset);
        font-family: var(--font-body);
        color: var(--ink);
        background:
            radial-gradient(1000px 500px at 100% -10%, color-mix(in srgb, var(--primary) 14%, transparent) 0%, transparent 70%),
            radial-gradient(900px 450px at 0% 0%, color-mix(in srgb, var(--accent) 10%, transparent) 0%, transparent 65%),
            var(--bg);
        padding-bottom: calc(96px + env(safe-area-inset-bottom));
    }
    h1, h2, h3 { margin-top: 0; color: var(--heading); font-family: var(--font-heading); }
    .container { width: 100%; max-width: var(--container-width); padding: 0 1rem; margin: 0 auto; }

    /* Topbar (identik dengan index.html) */
    .topbar {
        position: fixed; top: 0; left: 0; right: 0; z-index: 1200;
        backdrop-filter: blur(6px);
        background: var(--topbar-bg); border-bottom: 1px solid var(--topbar-line);
        box-shadow: 0 10px 26px rgba(15,31,56,.08);
    }
    main[id], section[id], [id].scroll-target { scroll-margin-top: calc(var(--public-header-offset) + 16px); }
    .topbar-marquee {
        border-top: 1px solid var(--topbar-subtle-line);
        border-bottom: 1px solid var(--topbar-subtle-line);
        background: var(--topbar-marquee-bg);
        overflow: hidden; white-space: nowrap;
    }
    .topbar-marquee-track {
        display: inline-block; padding: .42rem 0;
        color: var(--topbar-marquee-text); font-size: .84rem; font-weight: 600;
        animation: marquee-move 26s linear infinite;
    }
    @keyframes marquee-move { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    .topbar-inner {
        display: grid;
        grid-template-columns: minmax(220px, max-content) minmax(0, 1fr);
        grid-template-areas: "brand utility" "nav nav";
        align-items: center; padding: .8rem 0 .65rem; gap: .8rem 1rem; min-width: 0; position: relative;
    }
    .brand { grid-area: brand; display: flex; align-items: center; gap: .65rem; text-decoration: none; color: var(--topbar-text); font-weight: 800; letter-spacing: .2px; min-width: 0; }
    .brand span:last-child { display: block; min-width: 0; max-width: min(38vw, 440px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-badge { width: 36px; height: 36px; flex-shrink: 0; overflow: hidden; border-radius: 12px; display: grid; place-items: center; color: #fff; font-weight: 700; background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 74%, var(--surface))); box-shadow: 0 8px 18px color-mix(in srgb, var(--primary) 30%, transparent); }
    .brand-badge img { width: 100%; height: 100%; object-fit: contain; }
    .topbar-utility { grid-area: utility; display: flex; align-items: center; justify-content: flex-end; gap: .5rem; min-width: 0; flex-wrap: wrap; }
    .topbar-social { display: inline-flex; align-items: center; gap: .32rem; padding: .2rem; border: 1px solid var(--topbar-subtle-line); border-radius: 999px; background: var(--topbar-pill-bg); }
    .topbar-social-link { width: 30px; height: 30px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; color: var(--topbar-pill-text); text-decoration: none; transition: .18s ease; }
    .topbar-social-link:hover { text-decoration: none; color: #fff; background: var(--primary); }
    .topbar-contact-pill { max-width: 240px; display: inline-flex; align-items: center; gap: .45rem; padding: .48rem .78rem; border: 1px solid var(--topbar-subtle-line); border-radius: 999px; background: var(--topbar-pill-bg); color: var(--topbar-pill-text); text-decoration: none; font-size: .8rem; font-weight: 700; line-height: 1; }
    .topbar-contact-pill:hover { text-decoration: none; color: var(--primary); border-color: color-mix(in srgb, var(--primary) 28%, white); }
    .topbar-contact-pill span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-links { grid-area: nav; display: flex; align-items: flex-start; gap: 1rem; min-width: 0; justify-content: space-between; width: 100%; padding-top: .25rem; border-top: 1px solid var(--topbar-subtle-line); }
    .desktop-nav-shell { width: 100%; display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
    .mobile-nav-shell { display: none; width: 100%; }
    .public-nav { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; flex-wrap: wrap; gap: .2rem; min-width: 0; flex: 1 1 auto; }
    .public-nav-desktop { align-items: flex-start; }
    .public-nav-mobile { width: 100%; }
    .nav-item { position: relative; }
    .nav-link-main { appearance: none; border: 0; background: transparent; cursor: pointer; text-decoration: none; color: color-mix(in srgb, var(--topbar-text) 70%, transparent); font-weight: 600; font-size: .94rem; display: inline-flex; align-items: center; gap: .35rem; padding: .5rem .62rem; border-radius: 10px; white-space: nowrap; }
    .nav-link-main:hover, .nav-link-main.active { color: var(--topbar-active-text); background: var(--topbar-active-bg); }
    .nav-caret { display: inline-flex; width: 14px; height: 14px; opacity: .75; transition: transform .2s ease; }
    .nav-caret svg { width: 100%; height: 100%; }
    .nav-submenu { list-style: none; margin: 0; padding: .45rem; position: absolute; top: calc(100% + 8px); left: 0; min-width: 210px; border: 1px solid var(--line); border-radius: 12px; background: #fff; box-shadow: 0 16px 30px rgba(17, 36, 68, .12); opacity: 0; visibility: hidden; transform: translateY(8px); transition: .18s ease; z-index: 40; }
    .nav-submenu .nav-submenu { top: -.45rem; left: calc(100% + 6px); }
    .nav-item:focus-within > .nav-submenu, .nav-item:hover > .nav-submenu { opacity: 1; visibility: visible; transform: translateY(0); }
    .nav-item.is-open > .nav-link-main .nav-caret { transform: rotate(180deg); }
    .nav-submenu .nav-link-main { width: 100%; justify-content: space-between; border-radius: 8px; color: #405572; }
    .nav-submenu .nav-link-main:hover, .nav-submenu .nav-link-main.active { color: var(--primary); background: color-mix(in srgb, var(--primary) 10%, white); }
    .nav-auth { display: inline-flex; gap: .5rem; flex-shrink: 0; align-items: center; justify-content: flex-end; }
    .mobile-menu-toggle { display: none; grid-area: mobile; justify-self: end; width: 42px; height: 42px; border-radius: 11px; border: 1px solid var(--topbar-subtle-line); background: var(--topbar-pill-bg); align-items: center; justify-content: center; gap: 4px; padding: 0; flex-direction: column; cursor: pointer; }
    .mobile-menu-toggle span { width: 16px; height: 2px; border-radius: 999px; background: var(--topbar-pill-text); }

    @media (max-width: 980px) {
        .topbar-inner { display: flex; align-items: center; padding: .85rem 0; gap: .65rem; }
        .brand { flex: 1 1 auto; min-width: 0; }
        .brand-badge { width: 40px; height: 40px; border-radius: 14px; flex: 0 0 auto; }
        .brand span:last-child { max-width: none; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.15; font-size: .98rem; }
        .topbar-utility { display: none; }
        .mobile-menu-toggle { display: inline-flex; margin-left: auto; width: 48px; height: 48px; border-radius: 14px; flex: 0 0 auto; }
        .nav-links { display: none; flex-direction: column; align-items: flex-start; position: absolute; top: calc(100% + 8px); left: 0; right: 0; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 16px 30px rgba(17, 36, 68, .12); padding: .7rem; z-index: 1300; border-top: 1px solid var(--line); }
        .nav-links.is-open { display: flex; }
        .desktop-nav-shell { display: none; }
        .mobile-nav-shell { display: flex; width: 100%; flex-direction: column; }
        .public-nav { width: 100%; flex-direction: column; align-items: stretch; gap: .3rem; }
        .nav-item { border-radius: 12px; }
        .nav-link-main { width: 100%; justify-content: space-between; border-radius: 10px; padding: .62rem .72rem; color: #4f6286; font-weight: 700; }
        .nav-item.nav-has-children > .nav-link-main { background: #f7faff; border: 1px solid #e1e9f5; }
        .nav-link-main.active { background: #eaf2ff; color: #12458d; border-color: #cbdcf4; }
        .nav-auth { width: 100%; margin-top: .35rem; padding-top: .55rem; border-top: 1px solid #e1e9f5; flex-wrap: wrap; }
        .nav-submenu { display: none; border: 0; box-shadow: none; background: transparent; position: static; opacity: 1; visibility: visible; transform: none; min-width: 0; padding: .35rem 0 0 .55rem; margin-top: .2rem; border-left: 2px solid #dce7f7; margin-left: .4rem; }
        .nav-item.is-open > .nav-submenu { display: block; }
    }

    .page-wrap { padding: 1.2rem 0; }

    /* Breadcrumb */
    .breadcrumb { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .9rem; font-size: .86rem; color: #7b8aa6; }
    .breadcrumb a { color: #6b7b99; text-decoration: none; }
    .breadcrumb a:hover { color: var(--primary); }
    .breadcrumb .current { color: #4d6082; font-weight: 700; }

    /* Page header */
    .gallery-hero {
        border-radius: calc(var(--radius) + 4px);
        border: 1px solid color-mix(in srgb, var(--primary) 14%, var(--line));
        background: linear-gradient(135deg, color-mix(in srgb, var(--surface) 92%, var(--primary)), var(--surface));
        padding: 1.5rem 1.4rem;
        margin-bottom: 1rem;
        box-shadow: var(--card-shadow);
    }
    .gallery-hero-kicker {
        display: inline-flex; align-items: center; gap: .4rem;
        color: var(--primary); font-size: .74rem; font-weight: 900;
        text-transform: uppercase; letter-spacing: .06em; margin-bottom: .4rem;
    }
    .gallery-hero h1 { font-size: clamp(1.5rem, 3vw, 2.1rem); line-height: 1.2; margin-bottom: .4rem; }
    .gallery-hero p { margin: 0; color: var(--muted); max-width: 640px; line-height: 1.6; }

    /* Tabs */
    .gallery-toolbar {
        display: flex; align-items: center; justify-content: space-between; gap: .8rem;
        flex-wrap: wrap; margin-bottom: 1rem;
    }
    .gallery-tabs { display: flex; flex-wrap: wrap; gap: .45rem; }
    .gallery-tab {
        border: 1px solid color-mix(in srgb, var(--primary) 20%, var(--line));
        background: #fff; color: var(--primary-2);
        border-radius: 999px; padding: .5rem .9rem; font-weight: 700; font-size: .84rem;
        cursor: pointer; transition: .18s ease;
    }
    .gallery-tab span { color: #8494b3; font-weight: 600; }
    .gallery-tab:hover { border-color: color-mix(in srgb, var(--primary) 40%, var(--line)); }
    .gallery-tab.is-active {
        color: #fff; border-color: var(--primary);
        background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 76%, var(--surface)));
    }
    .gallery-tab.is-active span { color: rgba(255,255,255,.85); }
    .gallery-count { color: var(--muted); font-size: .84rem; font-weight: 700; white-space: nowrap; }

    /* Grid */
    .gallery-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: .85rem;
    }
    .gallery-photo-card {
        display: flex; flex-direction: column; text-align: left;
        border: 1px solid color-mix(in srgb, var(--primary) 12%, var(--line));
        border-radius: 16px; overflow: hidden; background: #fff; padding: 0;
        cursor: zoom-in; box-shadow: 0 12px 26px rgba(20,43,78,.07);
        transition: transform .18s ease, box-shadow .18s ease;
    }
    .gallery-photo-card:hover { transform: translateY(-2px); box-shadow: 0 18px 36px rgba(20,43,78,.13); }
    .gallery-photo-media { position: relative; width: 100%; aspect-ratio: 4 / 3; overflow: hidden; background: color-mix(in srgb, var(--primary) 7%, #fff); }
    .gallery-photo-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .gallery-photo-body { padding: .65rem .7rem .75rem; }
    .gallery-photo-album {
        display: inline-block; font-size: .68rem; font-weight: 800; color: var(--primary);
        text-transform: uppercase; letter-spacing: .04em; margin-bottom: .25rem;
    }
    .gallery-photo-title { display: block; font-size: .88rem; font-weight: 800; color: var(--heading); line-height: 1.3; }
    .gallery-empty { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 2rem 0; }

    @media (max-width: 980px) {
        .gallery-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
        .gallery-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem; }
        .gallery-hero { padding: 1.15rem; }
        .gallery-toolbar { flex-direction: column; align-items: flex-start; }
    }

    /* Footer (identik dengan index.html) */
    .footer .container { width: 100%; max-width: var(--container-width); padding-left: 1rem; padding-right: 1rem; margin: 0 auto; }
    .footer {
        border-top: 1px solid color-mix(in srgb, var(--primary) 38%, #050b18);
        color: var(--footer-text);
        font-size: .9rem;
        padding: 1.45rem 0 1.2rem;
        background: var(--footer-bg);
    }
    .footer-card {
        background: rgba(255,255,255,.08);
        border: 1px solid rgba(255,255,255,.16);
        border-radius: 16px;
        box-shadow: 0 18px 34px rgba(3, 10, 24, .16);
        padding: 1rem;
        backdrop-filter: blur(4px);
    }
    .footer-grid {
        display: grid;
        grid-template-columns: 1.2fr 1fr 1fr;
        gap: 1rem;
        margin-bottom: 1rem;
    }
    .footer-brand {
        display: flex;
        align-items: center;
        gap: .65rem;
        margin-bottom: .55rem;
        color: #ffffff;
        font-weight: 800;
        font-size: 1.08rem;
    }
    .footer-badge {
        width: 30px;
        height: 30px;

    .footer-badge img {

    }
    .footer-title {

    }

    .wa-float {

    .mobile-bottom-nav { display: none; }
    @media (max-width: 760px) {

    /* Lightbox (sama seperti index.html) */
    .photo-lightbox { position: fixed; inset: 0; z-index: 2500; display: none; place-items: center; padding: clamp(.8rem, 3vw, 2rem); background: rgba(3,10,24,.84); backdrop-filter: blur(8px); }

    .photo-lightbox-dialog { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 360px); width: min(1120px, 100%); max-height: min(760px, 92dvh); overflow: hidden; border: 1px solid rgba(255,255,255,.18); border-radius: 24px; background: #071225; box-shadow: 0 30px 90px rgba(0,0,0,.42); }
    .photo-lightbox-media { min-height: 420px; background: #020817; }
